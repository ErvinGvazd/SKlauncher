alert.duplicate.label.title=Jūs jau turite veikiantį Minecraft egzempliorių.
alert.duplicate.label.body=Jei paleisite kitą tą pačią direktoriją, jie gali konfliktuoti ir sugadinti jūsų išsaugojimus. \nTai gali sukelti daug problemų, vieno žaidėjo ar kitu režimu. Mes neatsakome už jokią žalą. \nAr norite paleisti dar vieną Minecraft egzempliorių nepaisant to? \nŠią problemą galite išspręsti paleidę žaidimą kitoje direktorijoje (žr. mygtuką „Redaguoti diegimą“).

